# Copie para config.toml. Aqui não entra segredo — segredo vai no .env.

[geral]
# Quem escreve e decide: "claude", "gemini" ou "openrouter".
# Deixe comentado para sair sozinho da chave que existir no .env.
# provedor = "gemini"

# Cada chave aparece UMA vez por seção — TOML recusa repetida.
modelo = "claude-opus-5-5"          # vale quando provedor = claude
modelo_gemini = "gemini-3.8-flash"  # vale quando provedor = gemini
modelo_openrouter = ""              # vazio = ele escolhe do catálogo

cidade = "Natal, RN"

# "link" = o agente escreve, você clica e manda (padrão, e o que mantém
# o seu número vivo). "cloud" = Cloud API oficial, exige conta aprovada.
canal_envio = "link"

equipe_netlify = "conta5197-99"

# Termo específico traz casa específica. "restaurante" sozinho traz
# shopping e praça de alimentação.
termos = [
  "restaurante caseiro",
  "comida regional",
  "pizzaria",
  "hamburgueria",
  "açaí",
  "cafeteria",
  "padaria e confeitaria",
  "tapiocaria",
]

[instagram]
# As capturas do perfil do lead, que alimentam a demonstração.
# Leia o topo de nucleo/insta.py antes de ligar: os Termos do Instagram
# proíbem acesso automatizado, e o risco é da SUA conta.
capturar_sozinho = true       # false = você manda os prints do celular
posts_por_perfil = 3          # cardápio e preço moram nos posts
perfil_instagram = ""         # vazio = dados/funil.instagram (login uma vez)

[vigia]
# O acompanhamento automático das conversas JÁ EM ANDAMENTO: ler quem
# respondeu, triar, responder, construir e entregar.
# O primeiro contato com quem nunca falou com você NÃO está aqui: ele sai
# por "funil.py enviar", com o seu clique. Veja o topo de nucleo/vigia.py.
responder_sozinho = true      # responde quem escreveu para você
varredura_a_cada = 10         # de N em N voltas, confere todas as conversas
horario = [8, 21]             # só age nesta faixa
intervalo_segundos = [20, 60] # espera sorteada antes de cada resposta
max_por_dia = 60
perfil_whatsapp = ""          # vazio = dados/funil.whatsapp (login uma vez)

[caminhos]
# Relativo a esta pasta, ou absoluto.
banco = "dados/funil.db"
saida = "saida"
material = "material"
